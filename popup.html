<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drink Water Reminder</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 300px;
      margin: 0;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      color: #12314d;
      background: #ffffff;
    }
    .header {
      background: linear-gradient(135deg, #2196f3, #0b6cad);
      padding: 22px 20px 18px;
      color: #fff;
      text-align: center;
    }
    .header .drop {
      font-size: 32px;
      line-height: 1;
      margin-bottom: 6px;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .header p {
      margin: 4px 0 0;
      font-size: 12px;
      opacity: 0.85;
    }
    .body {
      padding: 18px 20px 20px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      font-weight: 600;
      color: #3a6f92;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid #cde6f9;
      font-size: 14px;
      background: #f6fbff;
      color: #12314d;
      margin-bottom: 16px;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%232196f3'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }
    select:focus {
      outline: none;
      border-color: #2196f3;
    }
    button {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    #start {
      background: #2196f3;
      color: #fff;
      box-shadow: 0 2px 8px rgba(33, 150, 243, 0.35);
    }
    #start:hover {
      background: #1976d2;
    }
    #stop {
      background: #f4f8fb;
      color: #5b7d95;
      border: 1.5px solid #dcecf7;
      margin-top: 8px;
    }
    #stop:hover {
      background: #eaf3f9;
      color: #1976d2;
    }
    #status {
      margin-top: 14px;
      font-size: 12px;
      color: #3a6f92;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      background: #f2f9ff;
    }
    #today-count {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #0b6cad;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      background: #eaf6ff;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="drop">💧</div>
    <h1>Drink Water Reminder</h1>
    <p>Stay hydrated, stay sharp</p>
  </div>
  <div class="body">
    <label for="interval">Remind me every</label>
    <select id="interval">
      <option value="1">Every 1 minute (test)</option>
      <option value="15">Every 15 minutes</option>
      <option value="30">Every 30 minutes</option>
      <option value="45">Every 45 minutes</option>
      <option value="60" selected>Every 1 hour</option>
      <option value="90">Every 1.5 hours</option>
      <option value="120">Every 2 hours</option>
    </select>
    <button id="start">Start Reminder</button>
    <button id="stop">Stop Reminder</button>
    <div id="status"></div>
    <div id="today-count"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
